<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Connexion · Gestion RH</title><link rel="stylesheet" href="css/personnel.css"><style>
body{min-height:100vh;background:linear-gradient(135deg,#10213d 0%,#172d51 58%,#2563eb 140%);display:grid;place-items:center}.login-shell{width:min(980px,calc(100% - 2rem));display:grid;grid-template-columns:1.05fr .95fr;overflow:hidden;background:#fff;border-radius:22px;box-shadow:0 24px 70px #08152d80}.login-intro{padding:3.5rem;color:#fff;background:linear-gradient(145deg,#172d51,#244d8c)}.login-intro h1{margin:3rem 0 1rem;color:#fff;font-size:2.6rem}.login-intro p{max-width:31rem;color:#cfdbef;font-size:1.05rem}.login-form{padding:3.5rem}.login-form h2{margin-bottom:.35rem}.login-form .muted{margin-bottom:2rem}.login-form form{display:grid;gap:1.1rem}.login-form button{width:100%;margin-top:.5rem}.login-error{padding:.75rem;border-radius:9px;color:#a42f3e;background:#ffe5e8}.password{position:relative}.password button{position:absolute;right:.35rem;top:1.95rem;width:auto;margin:0;padding:.35rem .5rem;color:#64748b;background:transparent;box-shadow:none}@media(max-width:700px){.login-shell{display:block}.login-intro{display:none}.login-form{padding:2rem}}
</style></head><body><main class="login-shell"><section class="login-intro"><span class="brand-mark">RH</span><h1>Les talents font la différence.</h1><p>Un espace unique pour piloter vos recrutements, vos équipes et l'intégration de chaque collaborateur.</p></section><section class="login-form"><h2>Bienvenue</h2><p class="muted">Connectez-vous à votre espace professionnel.</p><div id="error" class="login-error" hidden></div><form id="login-form"><label>Identifiant<input name="identifiant" autocomplete="username" required autofocus></label><label class="password">Mot de passe<input id="password" name="motDePasse" type="password" autocomplete="current-password" required><button type="button" id="toggle" aria-label="Afficher le mot de passe">Afficher</button></label><button class="button-primary" type="submit">Se connecter</button></form></section></main><script src="js/api.js"></script><script>
const form=document.querySelector('#login-form'),error=document.querySelector('#error'),toggle=document.querySelector('#toggle');toggle.onclick=()=>{const p=document.querySelector('#password'),visible=p.type==='password';p.type=visible?'text':'password';toggle.textContent=visible?'Masquer':'Afficher';toggle.setAttribute('aria-label',visible?'Masquer le mot de passe':'Afficher le mot de passe')};form.onsubmit=async e=>{e.preventDefault();error.hidden=true;const button=form.querySelector('button[type=submit]');button.disabled=true;try{const result=await api.post('/api/auth/login',Object.fromEntries(new FormData(form)));sessionStorage.setItem('user',JSON.stringify(result.utilisateur||result));location.href='/web/dashboard.html'}catch(e){error.textContent=e.code==='COMPTE_DESACTIVE'?'Ce compte est désactivé':e.code==='CHAMPS_VIDES'?'Identifiant et mot de passe obligatoires':e.message||'Identifiants invalides';error.hidden=false;button.disabled=false}};
</script></body></html>
