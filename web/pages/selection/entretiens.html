<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entretiens · Gestion RH</title><link rel="stylesheet" href="../../css/personnel.css"></head><body><header class="app-header"><a class="brand" href="../../dashboard.html"><span class="brand-mark">RH</span>Gestion RH</a></header><main class="main"><div class="breadcrumb"><a href="../../dashboard.html">Tableau de bord</a> / Sélection</div><div class="page-heading"><h1>Entretiens</h1><button class="button-primary" id="refresh">Actualiser</button></div><section class="card"><div id="list" class="state">Chargement…</div></section></main><script src="../../js/api.js"></script><script src="../../js/ui.js"></script><script>async function load(){const list=document.querySelector('#list');list.innerHTML=ui.state('Chargement…');try{const rows=await api.get('/api/entretiens');const data=Array.isArray(rows)?rows:(rows.data||[]);list.innerHTML=data.length?`<div class="table-wrap"><table><thead><tr><th>Date</th><th>Candidat</th><th>Offre</th><th>Type</th><th>Statut</th></tr></thead><tbody>${data.map(x=>`<tr><td>${ui.date(x.date_entretien)}</td><td>${ui.escape([x.prenom_candidat,x.nom_candidat].filter(Boolean).join(' ')||'—')}</td><td>${ui.escape(x.offre||'—')}</td><td>${ui.escape(x.type_entretien||'—')}</td><td>${ui.status(x.statut||'—')}</td></tr>`).join('')}</tbody></table></div>`:ui.state('Aucun entretien planifié.')}catch(e){list.innerHTML=ui.state(e.message,true)}}document.querySelector('#refresh').onclick=load;load();</script></body></html>
