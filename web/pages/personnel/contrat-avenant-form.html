<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Avenant | Gestion RH</title>
    <link rel="stylesheet" href="../../css/personnel.css">
</head>

<body>
    <header class="app-header"><a href="../../dashboard.html">Gestion RH</a>
        <nav><a href="contrats.html">Contrats</a></nav>
    </header>
    <main class="main">
        <div class="breadcrumb"><a href="contrats.html">Contrats</a> / Avenant ou renouvellement</div>
        <div class="page-heading">
            <h1>Avenant / Renouvellement</h1>
        </div>
        <section class="card">
            <form id="amendment-form" class="form-grid"><label>Type<select name="type" required>
                        <option value="avenant">Avenant</option>
                        <option value="renouvellement">Renouvellement CDD</option>
                    </select></label><label>Nouveau poste <input name="idPoste" type="number"></label><label>Nouvelle
                    rémunération <input name="salaireBase" type="number" min="0" step="0.01"></label><label>Nouvelle
                    date de fin <input name="nouvelleDateFin" type="date"></label>
                <div class="actions field-wide"><a class="button button-secondary"
                        href="contrats.html">Annuler</a><button class="button-primary">Enregistrer</button></div>
            </form>
        </section>
    </main>
    <script src="../../js/api.js"></script>
    <script src="../../js/ui.js"></script>
    <script src="../../js/pages/personnel/contrat-avenant-form.js"></script>

</html>
