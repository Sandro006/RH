<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demandes de recrutement</title><link rel="stylesheet" href="../../css/personnel.css"></head><body><header class="app-header"><a class="brand" href="../../dashboard.html"><span class="brand-mark">RH</span>Gestion RH</a></header><main class="main"><div class="breadcrumb"><a href="../../dashboard.html">Tableau de bord</a> / Recrutement</div><div class="page-heading"><h1>Demandes de recrutement</h1><button class="button-primary" id="refresh">Actualiser</button></div><section class="card"><div id="error" class="error" hidden></div><div id="list" class="state">Chargement…</div></section></main><script src="../../js/api.js"></script><script src="../../js/ui.js"></script><script>async function load(){const list=document.querySelector('#list');list.innerHTML=ui.state('Chargement…');try{const rows=await api.get('/api/demandes');const data=Array.isArray(rows)?rows:(rows.data||[]);list.innerHTML=data.length?`<div class="table-wrap"><table><thead><tr><th>N°</th><th>Poste</th><th>Motif</th><th>Rémunération</th><th>Statut</th></tr></thead><tbody>${data.map(x=>`<tr><td>${x.id_demande}</td><td>${ui.escape(x.intitule||x.id_poste||'—')}</td><td>${ui.escape(x.motif||'—')}</td><td>${ui.money(x.remuneration_min)} – ${ui.money(x.remuneration_max)}</td><td>${ui.status(x.designation_statut||x.statut||'—')}</td></tr>`).join('')}</tbody></table></div>`:ui.state('Aucune demande disponible.')}catch(e){list.innerHTML=ui.state(e.message,true)}}document.querySelector('#refresh').onclick=load;load();</script></body></html>
