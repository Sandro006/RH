<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Changer le mot de passe · Gestion RH</title><link rel="stylesheet" href="../../css/personnel.css"></head><body><header class="app-header"><a class="brand" href="../../dashboard.html"><span class="brand-mark">RH</span>Gestion RH</a></header><main class="main"><div class="breadcrumb"><a href="../../dashboard.html">Tableau de bord</a> / Profil</div><section class="card" style="max-width:650px"><h1>Changer mon mot de passe</h1><p class="muted">Utilisez un mot de passe d'au moins 12 caractères et trois catégories de caractères.</p><div id="message" hidden></div><form id="form" class="form-grid"><label>Ancien mot de passe<input name="ancienMotDePasse" type="password" required></label><label>Nouveau mot de passe<input name="nouveauMotDePasse" type="password" minlength="12" required></label><label>Confirmation<input name="confirmation" type="password" minlength="12" required></label><div class="actions"><a class="button button-secondary" href="../../dashboard.html">Annuler</a><button class="button-primary">Enregistrer</button></div></form></section></main><script src="../../js/api.js"></script><script src="../../js/ui.js"></script><script>const form=document.querySelector('#form'),message=document.querySelector('#message');form.onsubmit=async event=>{event.preventDefault();const data=Object.fromEntries(new FormData(form));if(data.nouveauMotDePasse!==data.confirmation){message.textContent='Les deux nouveaux mots de passe doivent être identiques.';message.className='error';message.hidden=false;return}try{await api.patch('/api/auth/mot-de-passe',{ancienMotDePasse:data.ancienMotDePasse,nouveauMotDePasse:data.nouveauMotDePasse});message.textContent='Mot de passe modifié avec succès.';message.className='success';message.hidden=false;setTimeout(()=>location.href='../../dashboard.html',800)}catch(error){message.textContent=error.message;message.className='error';message.hidden=false}}</script></body></html>
